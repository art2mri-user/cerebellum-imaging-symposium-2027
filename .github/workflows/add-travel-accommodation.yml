name: Add Travel and Accommodation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-travel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update travel section
        shell: bash
        env:
          TRAVEL_B64: ""
          CSS_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')
          travel = base64.b64decode(os.environ['TRAVEL_B64']).decode('utf-8')
          if '.travel-intro {' not in s:
              s = s.replace('    .workshop { background:var(--accent); }', css + '\n\n    @media(max-width:980px){ .hotel-grid { grid-template-columns:1fr; } .transport-grid { grid-template-columns:1fr; } }\n\n    .workshop { background:var(--accent); }', 1)
          start = s.index('<section id="travel">')
          end = s.index('<section id="venue"', start)
          s = s[:start] + travel + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit travel update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add recommended accommodations and transportation guidance"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/add-travel-accommodation.yml
          git commit -m "Remove one-time travel update workflow"
          git push
