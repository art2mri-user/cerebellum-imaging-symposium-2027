name: Update workshop location

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-workshop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update hands-on MRI workshop location
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('<section id="workshop"')
          end = s.index('\n<section id="venue"', start)
          new = Path('workshop-fragment.html').read_text(encoding='utf-8')
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY

      - name: Commit updated workshop location and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm workshop-fragment.html .github/workflows/update-workshop-location.yml
          git commit -m "Add HC UNICAMP workshop location and map"
          git push
