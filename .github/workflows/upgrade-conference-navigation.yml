name: Upgrade conference navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-conference-navigation.yml'

permissions:
  contents: write

jobs:
  upgrade-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add conference-ready navigation and information sections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'nav { display: flex; gap: 24px; align-items: center; }\n    nav a { text-decoration: none; font-size: 14px; font-weight: 700; }',
              'nav { display: flex; gap: 14px; align-items: center; }\n    nav a { text-decoration: none; font-size: 13px; font-weight: 700; white-space:nowrap; }',
              1
          )

          s = s.replace(
              '    .btn.secondary { border:1px solid var(--line); background:white; }',
              '    .btn.secondary { border:1px solid var(--line); background:white; }\n    .btn.disabled { border:1px solid var(--line); background:#f1f4f6; color:#7c8995; cursor:default; }',
              1
          )

          anchor_css = '    .heading { max-width: 860px; margin-bottom: 40px; }\n\n'
          extra_css = '''    .heading { max-width: 860px; margin-bottom: 40px; }

    .important-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .date-card { border:1px solid var(--line); background:#fff; padding:22px; min-height:155px; display:flex; flex-direction:column; }
    .date-card .status { display:inline-flex; align-self:flex-start; padding:4px 8px; border-radius:999px; background:var(--accent); color:var(--primary-dark); font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; margin-bottom:14px; }
    .date-card .status.open { background:#fff0c7; color:#875c00; }
    .date-card strong { font-size:17px; margin-bottom:6px; }
    .date-card span { color:var(--muted); font-size:14px; margin-top:auto; }

'''
          if anchor_css not in s:
              raise SystemExit('CSS insertion anchor not found')
          s = s.replace(anchor_css, extra_css, 1)

          old_nav = '''    <nav>
      <a href="#about">About</a>
      <a href="#speakers">Speakers</a>
      <a href="#program">Program</a>
      <a href="#workshop">Workshop</a>
      <a href="#venue">Venue</a>
      <a href="#sponsorship">Sponsorship</a>
    </nav>'''
          new_nav = '''    <nav>
      <a href="#about">About</a>
      <a href="#speakers">Speakers</a>
      <a href="#program">Program</a>
      <a href="#abstracts">Abstracts</a>
      <a href="#registration">Registration</a>
      <a href="#workshop">Workshop</a>
      <a href="#travel">Travel</a>
      <a href="#venue">Venue</a>
      <a href="#sponsorship">Sponsors</a>
    </nav>'''
          if old_nav not in s:
              raise SystemExit('Navigation block not found')
          s = s.replace(old_nav, new_nav, 1)

          important = '''
<section id="dates">
  <div class="container">
    <div class="heading">
      <p class="kicker">Plan ahead</p>
      <h2>Important Dates</h2>
    </div>
    <div class="important-grid">
      <article class="date-card">
        <span class="status open">Open now</span>
        <strong>Expression of Interest</strong>
        <span>Tell us you are interested in joining the symposium in Campinas.</span>
      </article>
      <article class="date-card">
        <span class="status">Opening soon</span>
        <strong>Abstract Submission</strong>
        <span>Submission guidelines and deadlines will be announced.</span>
      </article>
      <article class="date-card">
        <span class="status">Opening soon</span>
        <strong>Registration</strong>
        <span>Registration categories, fees and workshop options will be announced.</span>
      </article>
      <article class="date-card">
        <span class="status">Save the date</span>
        <strong>April 14–16, 2027</strong>
        <span>Cerebellum Neuroimaging Symposium · Campinas, Brazil.</span>
      </article>
    </div>
  </div>
</section>

'''
          about_anchor = '<section id="about">'
          if about_anchor not in s:
              raise SystemExit('About section anchor not found')
          s = s.replace(about_anchor, important + about_anchor, 1)

          abstract_registration = '''
<section id="abstracts" class="soft">
  <div class="container split">
    <div>
      <p class="kicker">Scientific contributions</p>
      <h2>Abstract Submission</h2>
    </div>
    <div class="copy">
      <p>Abstract submission will open soon. Submission guidelines, deadlines, presentation formats and review criteria will be published here.</p>
      <p>Abstracts will be invited across the six scientific themes of the symposium, with selected contributions considered for oral presentation and poster presentation.</p>
      <span class="btn disabled" aria-disabled="true">Abstract submission · Opening soon</span>
    </div>
  </div>
</section>

<section id="registration">
  <div class="container split">
    <div>
      <p class="kicker">Join us in Campinas</p>
      <h2>Registration</h2>
    </div>
    <div class="copy">
      <p>Online registration will open soon. Registration categories, fees, eligibility information and participation options will be announced on this page.</p>
      <p>Information about participation in the hands-on MRI workshop will be included when registration opens.</p>
      <span class="btn disabled" aria-disabled="true">Registration · Opening soon</span>
    </div>
  </div>
</section>

'''
          workshop_anchor = '<section id="workshop" class="workshop">'
          if workshop_anchor not in s:
              raise SystemExit('Workshop anchor not found')
          s = s.replace(workshop_anchor, abstract_registration + workshop_anchor, 1)

          travel = '''
<section id="travel" class="soft">
  <div class="container split">
    <div>
      <p class="kicker">Getting to Campinas</p>
      <h2>Travel &amp; Accommodation</h2>
    </div>
    <div class="copy">
      <p>Travel guidance will be added as the meeting approaches, including recommended accommodation, airport information, local transportation and practical information for international visitors.</p>
      <p><strong>Detailed travel and hotel recommendations are coming soon.</strong></p>
    </div>
  </div>
</section>

'''
          venue_anchor = '<section id="venue">'
          if venue_anchor not in s:
              raise SystemExit('Venue anchor not found')
          s = s.replace(venue_anchor, travel + venue_anchor, 1)

          old_updates = '''<section class="soft" id="updates">
  <div class="container split">
    <div>
      <p class="kicker">Coming soon</p>
      <h2>Registration, abstracts and travel information.</h2>
    </div>
    <div class="copy">
      <p>This website will be updated as registration information, abstract deadlines, additional speakers, sponsors and detailed travel guidance are confirmed.</p>
    </div>
  </div>
</section>'''
          new_updates = '''<section class="soft" id="updates">
  <div class="container split">
    <div>
      <p class="kicker">Stay informed</p>
      <h2>Be the first to hear about registration and abstracts.</h2>
    </div>
    <div class="copy">
      <p>Registration and abstract submission are not open yet. In the meantime, let us know you are interested in attending the Cerebellum Neuroimaging Symposium 2027.</p>
      <a class="btn interest" href="https://forms.gle/rCNTC6VUyXUfFH4u8" target="_blank" rel="noopener noreferrer">Expression of Interest</a>
    </div>
  </div>
</section>'''
          if old_updates not in s:
              raise SystemExit('Updates section not found')
          s = s.replace(old_updates, new_updates, 1)

          old_footer = '<div class="footer-links"><a href="#speakers">Speakers</a><a href="#program">Program</a><a href="#venue">Venue</a></div>'
          new_footer = '<div class="footer-links"><a href="#speakers">Speakers</a><a href="#program">Program</a><a href="#abstracts">Abstracts</a><a href="#registration">Registration</a><a href="#travel">Travel</a><a href="#venue">Venue</a></div>'
          if old_footer not in s:
              raise SystemExit('Footer links not found')
          s = s.replace(old_footer, new_footer, 1)

          old_980 = '''    @media(max-width:980px){
      .speaker-grid { grid-template-columns: repeat(2,1fr); }
      .steering-grid { grid-template-columns:repeat(3,1fr); }
      .hero-grid, .split, .venue-grid { grid-template-columns:1fr; gap:42px; }
    }'''
          new_980 = '''    @media(max-width:980px){
      .speaker-grid { grid-template-columns: repeat(2,1fr); }
      .steering-grid { grid-template-columns:repeat(3,1fr); }
      .important-grid { grid-template-columns:repeat(2,1fr); }
      .hero-grid, .split, .venue-grid { grid-template-columns:1fr; gap:42px; }
    }'''
          if old_980 not in s:
              raise SystemExit('980 media block not found')
          s = s.replace(old_980, new_980, 1)

          s = s.replace(
              '      .sponsor-grid { grid-template-columns:1fr; }',
              '      .sponsor-grid { grid-template-columns:1fr; }\n      .important-grid { grid-template-columns:1fr; }\n      .footer-links { flex-wrap:wrap; }',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit website upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add conference-ready registration abstract and travel sections"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/upgrade-conference-navigation.yml
          git commit -m "Remove one-time site upgrade workflow"
          git push
