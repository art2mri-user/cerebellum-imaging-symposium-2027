name: Update Steering Committee

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-steering-committee:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add compact Steering Committee photo layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          def dec(x): return base64.b64decode(x).decode('utf-8')
          replacements = [
              ('', ''),
              ('ICAgIEBtZWRpYShtYXgtd2lkdGg6OTgwcHgpewogICAgICAuc3BlYWtlci1ncmlkIHsgZ3JpZC10ZW1wbGF0ZS1jb2x1bW5zOiByZXBlYXQoMiwxZnIpOyB9CiAgICAgIC5oZXJvLWdyaWQsIC5zcGxpdCwgLnZlbnVlLWdyaWQgeyBncmlkLXRlbXBsYXRlLWNvbHVtbnM6MWZyOyBnYXA6NDJweDsgfQogICAgfQ==', ''),
              ('ICAgICAgLmNvbW1pdHRlZSB7IGdyaWQtdGVtcGxhdGUtY29sdW1uczoxZnI7IH0=', 'ICAgICAgLnN0ZWVyaW5nLWdyaWQgeyBncmlkLXRlbXBsYXRlLWNvbHVtbnM6cmVwZWF0KDIsMWZyKTsgZ2FwOjI0cHggMTZweDsgfQ=='),
              ('', '')
          ]
          for old_b64, new_b64 in replacements:
              old, new = dec(old_b64), dec(new_b64)
              if old not in s:
                  raise SystemExit('Expected source block not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit Steering Committee update and clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add compact Steering Committee photo section"
          git push
          git rm .github/workflows/update-steering-committee.yml
          git commit -m "Remove one-time Steering Committee workflow"
          git push
