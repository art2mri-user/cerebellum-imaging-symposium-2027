name: Update Steering Committee

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-steering-committee:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add compact Steering Committee photo layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '''    .committee { display:grid; grid-template-columns:repeat(2,1fr); border-top:1px solid var(--line); }
    .committee div { padding:18px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; }
    .committee strong { font-size:15px; }
    .committee span { color:var(--muted); font-size:13px; }'''

          new_css = '''    .steering-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:26px; align-items:start; }
    .steering-member { text-align:center; padding:4px; }
    .steering-photo { width:112px; height:112px; border-radius:50%; object-fit:cover; object-position:center top; display:block; margin:0 auto 14px; border:3px solid #fff; box-shadow:0 0 0 1px var(--line), 0 7px 18px rgba(20,33,61,.06); background:#eef3f6; }
    .steering-member strong { display:block; font-size:15px; line-height:1.25; }
    .steering-member span { display:block; color:var(--muted); font-size:12px; line-height:1.35; margin-top:6px; }'''

          if old_css not in s:
              raise SystemExit('Expected committee CSS block not found')
          s = s.replace(old_css, new_css)

          old_980 = '''    @media(max-width:980px){
      .speaker-grid { grid-template-columns: repeat(2,1fr); }
      .hero-grid, .split, .venue-grid { grid-template-columns:1fr; gap:42px; }
    }'''
          new_980 = '''    @media(max-width:980px){
      .speaker-grid { grid-template-columns: repeat(2,1fr); }
      .steering-grid { grid-template-columns:repeat(3,1fr); }
      .hero-grid, .split, .venue-grid { grid-template-columns:1fr; gap:42px; }
    }'''
          if old_980 not in s:
              raise SystemExit('Expected 980px media block not found')
          s = s.replace(old_980, new_980)

          old_760 = '''      .committee { grid-template-columns:1fr; }'''
          new_760 = '''      .steering-grid { grid-template-columns:repeat(2,1fr); gap:24px 16px; }'''
          if old_760 not in s:
              raise SystemExit('Expected committee responsive rule not found')
          s = s.replace(old_760, new_760)

          old_section = '''<section class="soft" id="committee">
  <div class="container">
    <div class="heading">
      <p class="kicker">Organizing committee</p>
      <h2>Scientific leadership</h2>
    </div>
    <div class="committee">
      <div><strong>Thiago Junqueira Ribeiro de Rezende</strong><span>University of São Paulo &amp; University of Campinas, Brazil</span></div>
      <div><strong>Ian H. Harding</strong><span>Queensland Institute of Medical Research, Australia</span></div>
      <div><strong>Marcondes Cavalcante França Jr</strong><span>University of Campinas, Brazil</span></div>
      <div><strong>Pierre-Gilles Henry</strong><span>University of Minnesota, USA</span></div>
      <div><strong>Sheeba Anteraper</strong><span>UT Southwestern, USA</span></div>
    </div>
  </div>
</section>'''

          new_section = '''<section class="soft" id="committee">
  <div class="container">
    <div class="heading">
      <p class="kicker">Scientific leadership</p>
      <h2>Steering Committee</h2>
    </div>
    <div class="steering-grid">
      <article class="steering-member">
        <img class="steering-photo" src="assets/thiago-rezende.jpg" alt="Portrait of Thiago Junqueira Ribeiro de Rezende">
        <strong>Thiago Junqueira Ribeiro de Rezende</strong>
        <span>University of São Paulo &amp; University of Campinas, Brazil</span>
      </article>
      <article class="steering-member">
        <img class="steering-photo" src="assets/ian-harding.jpg" alt="Portrait of Ian H. Harding">
        <strong>Ian H. Harding</strong>
        <span>Queensland Institute of Medical Research, Australia</span>
      </article>
      <article class="steering-member">
        <img class="steering-photo" src="assets/marcondes-franca.jpg" alt="Portrait of Marcondes Cavalcante França Jr">
        <strong>Marcondes Cavalcante França Jr</strong>
        <span>University of Campinas, Brazil</span>
      </article>
      <article class="steering-member">
        <img class="steering-photo" src="assets/pierre-gilles-henry.jpg" alt="Portrait of Pierre-Gilles Henry">
        <strong>Pierre-Gilles Henry</strong>
        <span>University of Minnesota, USA</span>
      </article>
      <article class="steering-member">
        <img class="steering-photo" src="assets/sheeba-anteraper.jpg" alt="Portrait of Sheeba Anteraper">
        <strong>Sheeba Anteraper</strong>
        <span>UT Southwestern, USA</span>
      </article>
    </div>
  </div>
</section>'''

          if old_section not in s:
              raise SystemExit('Expected committee HTML section not found')
          s = s.replace(old_section, new_section)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit Steering Committee update and clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add compact Steering Committee photo section"
          git push
          git rm .github/workflows/update-steering-committee.yml
          git commit -m "Remove one-time Steering Committee workflow"
          git push
