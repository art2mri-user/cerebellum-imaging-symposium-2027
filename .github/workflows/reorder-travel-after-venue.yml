name: Reorder travel after venue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Travel & Accommodation after Venue
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Move the full travel section to immediately after venue.
          travel_start = s.index('<section id="travel">')
          travel_end = s.index('</section>', travel_start) + len('</section>')
          travel_block = s[travel_start:travel_end]
          s = s[:travel_start] + s[travel_end:]

          venue_start = s.index('<section id="venue"')
          venue_end = s.index('</section>', venue_start) + len('</section>')
          s = s[:venue_end] + '\n\n' + travel_block + s[venue_end:]

          # Keep navigation consistent: Venue -> Travel -> Sponsors.
          s = s.replace(
              '      <a href="#workshop">Workshop</a>\n      <a href="#venue">Venue</a>\n      <a href="#sponsorship">Sponsors</a>\n      <a href="#travel">Travel</a>',
              '      <a href="#workshop">Workshop</a>\n      <a href="#venue">Venue</a>\n      <a href="#travel">Travel</a>\n      <a href="#sponsorship">Sponsors</a>',
              1
          )

          # Keep footer order consistent where present.
          s = s.replace(
              '      <a href="#registration">Registration</a>\n      <a href="#travel">Travel</a>\n      <a href="#venue">Venue</a>',
              '      <a href="#registration">Registration</a>\n      <a href="#venue">Venue</a>\n      <a href="#travel">Travel</a>',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit reorder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place travel section immediately after venue"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/reorder-travel-after-venue.yml
          git commit -m "Remove one-time travel reorder workflow"
          git push
