name: Add Expression of Interest CTA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add highlighted Expression of Interest links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = "    .btn.secondary { border:1px solid var(--line); background:white; }\n"
          css_add = """    .btn.secondary { border:1px solid var(--line); background:white; }\n    .btn.interest { background:#f0a202; color:#14213d; border:1px solid #f0a202; box-shadow:0 8px 22px rgba(240,162,2,.22); }\n    .btn.interest:hover { background:#d99100; border-color:#d99100; }\n    .interest-band { padding:26px 0; background:var(--ink); color:#fff; }\n    .interest-wrap { display:flex; align-items:center; justify-content:space-between; gap:28px; }\n    .interest-band .kicker { color:#9de2e7; margin-bottom:5px; }\n    .interest-band h2 { font-family:Georgia, 'Times New Roman', serif; font-size:clamp(25px,3vw,36px); margin:0 0 5px; letter-spacing:-.025em; }\n    .interest-band p { margin:0; color:#d8e1e8; }\n    .interest-band .btn { flex:0 0 auto; }\n"""
          if '.btn.interest {' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_add, 1)

          responsive_anchor = "      .footer-wrap { flex-direction:column; align-items:flex-start; }\n"
          responsive_add = "      .footer-wrap { flex-direction:column; align-items:flex-start; }\n      .interest-wrap { flex-direction:column; align-items:flex-start; }\n"
          if '.interest-wrap { flex-direction:column' not in s:
              if responsive_anchor not in s:
                  raise SystemExit('Responsive anchor not found')
              s = s.replace(responsive_anchor, responsive_add, 1)

          old_actions = """      <div class=\"actions\">\n        <a class=\"btn primary\" href=\"#program\">Preliminary program</a>\n        <a class=\"btn secondary\" href=\"#speakers\">Keynote speakers</a>\n      </div>"""
          new_actions = """      <div class=\"actions\">\n        <a class=\"btn interest\" href=\"https://forms.gle/rCNTC6VUyXUfFH4u8\" target=\"_blank\" rel=\"noopener noreferrer\">Expression of Interest</a>\n        <a class=\"btn primary\" href=\"#program\">Preliminary program</a>\n        <a class=\"btn secondary\" href=\"#speakers\">Keynote speakers</a>\n      </div>"""
          if 'href="https://forms.gle/rCNTC6VUyXUfFH4u8"' not in s:
              if old_actions not in s:
                  raise SystemExit('Hero actions anchor not found')
              s = s.replace(old_actions, new_actions, 1)

          about_anchor = """</section>\n\n<section id=\"about\">"""
          band = """</section>\n\n<section class=\"interest-band\" aria-label=\"Expression of Interest\">\n  <div class=\"container interest-wrap\">\n    <div>\n      <p class=\"kicker\">Expression of Interest now open</p>\n      <h2>Interested in joining us in Campinas?</h2>\n      <p>Complete the Expression of Interest form for the Cerebellum Neuroimaging Symposium 2027.</p>\n    </div>\n    <a class=\"btn interest\" href=\"https://forms.gle/rCNTC6VUyXUfFH4u8\" target=\"_blank\" rel=\"noopener noreferrer\">Complete the form →</a>\n  </div>\n</section>\n\n<section id=\"about\">"""
          if 'Expression of Interest now open' not in s:
              if about_anchor not in s:
                  raise SystemExit('About section anchor not found')
              s = s.replace(about_anchor, band, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit site update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-expression-of-interest.yml
          git commit -m "Highlight Expression of Interest form"
          git push
