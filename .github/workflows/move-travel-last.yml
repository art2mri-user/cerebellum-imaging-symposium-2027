name: Move Travel Section Last

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move-travel:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Travel and Accommodation to the end
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('<section id="travel">')
          end = s.index('<section id="venue"', start)
          travel = s[start:end]
          s = s[:start] + s[end:]

          # Put Travel as the final content section before </main>
          main_end = s.index('</main>')
          s = s[:main_end] + travel + s[main_end:]

          # Keep navigation hierarchy consistent: Travel should be last
          old_nav = '''      <a href="#workshop">Workshop</a>\n      <a href="#travel">Travel</a>\n      <a href="#venue">Venue</a>\n      <a href="#sponsorship">Sponsors</a>'''
          new_nav = '''      <a href="#workshop">Workshop</a>\n      <a href="#venue">Venue</a>\n      <a href="#sponsorship">Sponsors</a>\n      <a href="#travel">Travel</a>'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          # Keep footer hierarchy consistent as well
          old_footer = '<a href="#registration">Registration</a><a href="#travel">Travel</a><a href="#venue">Venue</a>'
          new_footer = '<a href="#registration">Registration</a><a href="#venue">Venue</a><a href="#travel">Travel</a>'
          if old_footer in s:
              s = s.replace(old_footer, new_footer, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit section reorder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move travel and accommodation to end of site"
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          git rm .github/workflows/move-travel-last.yml
          git commit -m "Remove one-time travel reorder workflow"
          git push
