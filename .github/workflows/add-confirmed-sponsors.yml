name: Add confirmed sponsors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-sponsors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add sponsor logos and section
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          echo '' | base64 -d > assets/fara.webp
          echo '' | base64 -d > assets/agi.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'class="sponsor-grid"' not in html:
              css = '.sponsor-intro{max-width:760px;margin:0 auto 34px}.sponsor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:900px;margin:0 auto}.sponsor-card{background:#fff;border:1px solid var(--line);padding:28px 24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px}.sponsor-logo-wrap{width:100%;height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}.sponsor-logo{display:block;max-width:100%;max-height:145px;width:auto;height:auto;object-fit:contain}.sponsor-card h3{margin:0;font-size:17px;line-height:1.3;text-align:center}.sponsor-note{margin-top:30px!important;font-size:14px!important}@media(max-width:560px){.sponsor-grid{grid-template-columns:1fr}.sponsor-card{min-height:220px}}'
              html = html.replace('footer{background:', css + 'footer{background:', 1)
              html = html.replace('<a href="#sponsorship">Sponsorship</a>', '<a href="#sponsorship">Sponsors</a>', 1)
              section = '''<section id="sponsorship"><div class="container cta"><p class="kicker">Sponsors &amp; partners</p><h2>Confirmed sponsors</h2><p class="sponsor-intro">We gratefully acknowledge the organizations supporting the Cerebellum Neuroimaging Symposium 2027.</p><div class="sponsor-grid"><article class="sponsor-card"><div class="sponsor-logo-wrap"><img class="sponsor-logo" src="assets/fara.webp" alt="Friedreich's Ataxia Research Alliance (FARA) logo"></div><h3>Friedreich's Ataxia Research Alliance</h3></article><article class="sponsor-card"><div class="sponsor-logo-wrap"><img class="sponsor-logo" src="assets/agi.webp" alt="Ataxia Global Initiative (AGI) logo"></div><h3>Ataxia Global Initiative</h3></article></div><p class="sponsor-note">Additional sponsorship and partnership opportunities remain available.</p></div></section>'''
              html, n = re.subn(r'<section id="sponsorship">.*?</section>', section, html, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Could not locate sponsorship section')
              path.write_text(html, encoding='utf-8')
          PY

      - name: Commit sponsor update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/fara.webp assets/agi.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Add FARA and AGI as confirmed sponsors'
            git push
          fi
