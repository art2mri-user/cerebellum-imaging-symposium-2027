name: Add Co-Chair Tags

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-cochair-tags:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Steering Committee
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          def d(x): return base64.b64decode(x).decode('utf-8')
          replacements = [
            ('ICAgIC5zdGVlcmluZy1tZW1iZXIgc3Ryb25nIHsgZGlzcGxheTpibG9jazsgZm9udC1zaXplOjE1cHg7IGxpbmUtaGVpZ2h0OjEuMjU7IH0KICAgIC5zdGVlcmluZy1tZW1iZXIgc3BhbiB7IGRpc3BsYXk6YmxvY2s7IGNvbG9yOnZhcigtLW11dGVkKTsgZm9udC1zaXplOjEycHg7IGxpbmUtaGVpZ2h0OjEuMzU7IG1hcmdpbi10b3A6NnB4OyB9',''),
            ('PHN0cm9uZz5UaGlhZ28gSnVucXVlaXJhIFJpYmVpcm8gZGUgUmV6ZW5kZTwvc3Ryb25nPg==','PHN0cm9uZz5UaGlhZ28gSnVucXVlaXJhIFJpYmVpcm8gZGUgUmV6ZW5kZSA8c3BhbiBjbGFzcz0icm9sZS10YWciPkNvLUNoYWlyPC9zcGFuPjwvc3Ryb25nPg=='),
            ('PHN0cm9uZz5JYW4gSC4gSGFyZGluZzwvc3Ryb25nPg==','PHN0cm9uZz5JYW4gSC4gSGFyZGluZyA8c3BhbiBjbGFzcz0icm9sZS10YWciPkNvLUNoYWlyPC9zcGFuPjwvc3Ryb25nPg==')
          ]
          for a,b in replacements:
              old,new=d(a),d(b)
              if old not in s:
                  raise SystemExit('Expected block not found')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Co-Chair tags to Steering Committee"
          git push
          git rm .github/workflows/add-cochair-tags.yml
          git commit -m "Remove one-time Co-Chair workflow"
          git push
